schema_version = "1.3"

[task]
name = "qsc/capacitated-network-certificates"
description = "Produce independently checkable shortest-path and maximum-flow certificates for a directed capacitated network with parallel edges and signed costs."
authors = [{ name = "QSC" }]
keywords = ["graph-algorithms", "maximum-flow", "shortest-path", "certificates", "multigraph"]

[agent]
timeout_sec = 3600

[environment]
build_timeout_sec = 900
cpus = 1
memory_mb = 2048
storage_mb = 4096
gpus = 0
allow_internet = true

[verifier]
timeout_sec = 300

[metadata]
difficulty = "expert"
category = "H.1 数学问题"
tags = ["离散图", "流与割", "负权路径"]
expert_time_estimate = "10h"
