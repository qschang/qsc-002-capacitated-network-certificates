schema_version = "1.3"

[task]
name = "qsc/capacitated-network-certificates"
description = "Produce a minimum-cost maximum-throughput plan and independently checkable primal, cut, and residual-potential certificates for a directed transport network."
authors = [{ name = "QSC" }]
keywords = ["network-optimization", "maximum-flow", "minimum-cost-flow", "duality", "multigraph"]

[agent]
timeout_sec = 3600

[environment]
build_timeout_sec = 900
cpus = 1
memory_mb = 2048
storage_mb = 4096
gpus = 0
allow_internet = true

[verifier]
timeout_sec = 300

[metadata]
difficulty = "expert"
category = "H.1 Mathematics"
tags = ["discrete-graph", "flow-cut", "primal-dual-certificate"]
expert_time_estimate = "10h"
